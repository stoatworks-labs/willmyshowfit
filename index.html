    <noscript>
      <h1>Will my show fit?</h1>
      <p>Describe a show (the screens and their canvases, the layers on each, every source and every destination) and it works out which switchers will actually take it. Adding up the inputs is what a spreadsheet does, and it's what catches people out. This checks there's a physical plug of the right type and capability for every signal, that the layer budget covers the layers the way each manufacturer counts them, and that the canvas fits. It checks thirty-seven machines, then proposes a wiring topology for each one that fits.</p>
      <h2>The switchers it checks</h2>
      <ul>
        <li>Analog Way: Midra 4K (QuickVu, QuickMatrix, Pulse, Eikos, each mode checked separately), Alta 4K (Zenith 100/200), LivePremier (Aquilon RS alpha, RS1–RS6), Midra pre-4K (QuickVu 3G, QuickMatriX, Pulse², SmartMatriX², Saphyr, Eikos²) and LiveCore (NeXtage 08/16 - 4K, Ascender 16/32/48 - 4K, SmartMatriX Ultra)</li>
        <li>Barco: S3 standalone, E2 Gen 1, E2 Gen 2, ENCORE3</li>
        <li>PixelHue: F4, F8</li>
        <li>Roland: V-160HD, VR-400UHD, V-600UHD</li>
        <li>Blackmagic Design: ATEM 1/2/4 M/E Constellation 4K</li>
      </ul>
      <p>Every figure comes from published vendor documentation and is cited on the device that uses it. None of it has been verified against hardware, so treat a "fits" as a shortlist, not a purchase order.</p>
      <p>It runs entirely in the browser, and nothing is uploaded. It needs JavaScript to run.</p>
